<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/inicio.css">
</head>
<body>
    <header>
    <h1
      class="p-3 bg-primary text-white d-flex justify-content-center align-content-center"
    >
      Información en tus manos
    </h1>
    <main>
    <div id="formulario" class="align-content-center">
     <form class="p-3">
        <div class="form-group row">
           <label for="inputEmail3" class="col-sm-2 col-form-label">Correo Electronico</label>
           <div class="col-sm-10 m-2">
              <input type="email" class="form-control" id="inputEmail3" placeholder="ingresar correo electronico">
           </div>
        </div>
        <div class="form-group row">
           <label for="inputPassword3" class="col-sm-2 col-form-label">Contraseña</label>
           <div class="col-sm-10 m-2">
              <input type="password" class="form-control" id="inputPassword3" placeholder="ingresar contraseña">
           </div>
        </div>
         <p id="olvidaste" ><a href="recuperacion.html">¿Olvidaste tu contraseña?</a></p>
        <div class="form-group row text-center">
           <div class="col-sm-10 text-center" >
               <button type="submit" class="btn btn-primary">Iniciar Sesion</button>
           </div>
        </div>
    </form>
  </div>
    </main>
</body>
</html>
