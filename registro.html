<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/styleRegistro.css" />
  </head>
  <div class="fondo_base m-4">
    <br />
    <body>
      <header>
        <nav class="d-flex m-3 navbar navbar-expand-lg bg-primary">
          <div class="d-flex justify-content-evenly container-fluid">
            <a class="navbar-brand" href="#">Tu Carrera</a>
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNavDropdown"
              aria-controls="navbarNavDropdown"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="#"
                    >Inicio</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">universidades</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#"> carreras</a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </header>
      <main>
        <section>
          <h1 class="text-center p-4 mt-3">Registrate</h1>
          <form class="bg-secondary p-5">
            <div class="mb-3">
              <label for="nombreRegist" class="form-label">Nombre:</label>
              <input
                type="text"
                id="nombreRegist"
                class="form-control"
                placeholder="Ingrese su nombre."
              />
            </div>
            <div class="mb-3">
              <label for="apellidoRegist" class="form-label">Apellido:</label>
              <input
                type="text"
                id="apellidoRegist"
                class="form-control"
                placeholder="Ingrese su apellido."
              />
            </div>
            <div class="mb-3">
              <label for="usuarioRegist" class="form-label"
                >Nombre de usuario:</label
              >
              <input
                type="text"
                id="usuarioRegist"
                class="form-control"
                placeholder="Cree un nombre usuario único."
              />
            </div>
            <div class="mb-3">
              <label for="cuilRegist" class="form-label">CUIL:</label>
              <input
                type="text"
                id="cuilRegist"
                class="form-control"
                placeholder="Ingrese su CUIL."
              />
            </div>
            <div class="mb-3">
              <label for="emailRegist" class="form-label"
                >Correo electrónico:</label
              >
              <input
                type="email"
                class="form-control"
                id="emailRegist"
                aria-describedby="emailHelp"
              />
            </div>
            <div class="mb-3">
              <label for="contraseñaRegist" class="form-label"
                >Contraseña:</label
              >
              <input
                type="password"
                class="form-control"
                id="contraseñaRegist"
              />
            </div>
            <div class="mb-3">
              <label for="contraseñaVerificacionRegist" class="form-label"
                >Repetir contraseña:</label
              >
              <input
                type="password"
                class="form-control"
                id="contraseñaVerificacionRegist"
              />
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
          </form>
        </section>
      </main>
      <script src="assets/js/app_registro.js"></script>
      <br />
    </body>
  </div>
</html>
